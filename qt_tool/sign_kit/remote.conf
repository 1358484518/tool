# sign_kit/remote.conf —— 远程签名配置（随仓库提交，团队共享）
#
# ⚠️ 本文件**只放服务地址、配置档映射与 CA 路径**。
#    **绝不要**把令牌写进这里：令牌只从环境变量或 ~/.tfm_sign_token 读取。
#
# 配置项是 KEY=VALUE 文本（不是 shell 脚本），键名允许含 '-' 与 '_'。

# ---- 基本配置 ----
# local  = 用仓库内的开发私钥 keys/dev/<key_id>.pem 本地签名（默认；不联网、不需要令牌）
# remote = 走内网签名服务（正式密钥在服务端；临时联调用 --remote）
# 正式出包用 sign_prod.bat / sign_prod.sh（强制 remote），见 sign_kit/README.md
SIGN_MODE=local

# 签名服务地址。推荐 https。
# 留空时回退读取环境变量 TFM_SIGN_SERVER_URL（这样各人无需改动本文件）。
# 若确需走明文 http，必须同时设置 ALLOW_INSECURE_HTTP=1。
SIGN_SERVER_URL=https://192.168.1.238

# 公司内部 CA / 自签证书路径（留空则用系统信任库）。禁止关闭证书校验。
CA_BUNDLE=tls/tfm-sign-ca.crt

# 单次请求超时（秒）
TIMEOUT=30

# 产物输出目录：留空/不写 = 与输入 bin 同目录；kit = 写回本 sign_kit 目录
# （CubeIDE 工程沿用"产物落 sign_kit\"的约定，其副本在此写 OUT_DIR=kit）
#OUT_DIR=kit

# 未指定 --profile 时使用哪个配置档
DEFAULT_PROFILE=DEV-CCU

# 正式签名入口（sign_prod.bat / sign_prod.sh）使用的配置档：
#   留空 = 尚未下发正式密钥，sign_prod 会明确报错（绝不退回开发密钥）；
#   日常构建用上面的 DEFAULT_PROFILE（开发密钥），只有正式出包才用本项。
# G0 产品正式档。私钥在签名服务器上，本地只有 sign_kit/keys/G0-V2G-*.pem。
PROD_PROFILE=G0-V2G

# 令牌来源（二者取其一，优先环境变量）：
#   环境变量名，默认 TFM_SIGN_TOKEN
TOKEN_ENV=TFM_SIGN_TOKEN
# 用户主目录下的令牌文件，默认 ~/.tfm_sign_token
#TOKEN_FILE=~/.tfm_sign_token

# 确认内网可信且必须走明文 http 时才打开（会明文传输令牌与摘要）
#ALLOW_INSECURE_HTTP=1

# ---- 配置档：镜像角色 → key_id 的显式映射 ----
#
# 规则（修改前请与团队确认，不要凭记忆填写）：
#   1) 用 `./sign.sh --profile <名称> <bin>` 选择配置档；缺省用 DEFAULT_PROFILE
#   2) 必须同时提供 SPE 与 NS 两条，缺任一条会直接报错
#   3) **不会**按 "<名称>-SPE" 自动推断 key_id —— 刻意的设计，防止签错密钥
#   4) 同一把密钥用于两侧时，两条映射写同一个 key_id 即可
#
# 开发阶段（所有产品共用；开发共享令牌以 DEV- 前缀授权）
PROFILE_DEV-CCU_SPE=DEV-CCU-SPE
PROFILE_DEV-CCU_NS=DEV-CCU-NS
PROFILE_DEV-SECC_SPE=DEV-SECC-SPE
PROFILE_DEV-SECC_NS=DEV-SECC-NS

# 量产阶段（各项目独占；令牌按项目精确授权）
# G0、RAT、RD0047。RD0050 和 EAW 的正式包沿用 RD0047-V2G。
# 日常 sign_prod 仍用上面的 PROD_PROFILE=G0-V2G。Qt 按产品传 --profile。
PROFILE_G0-V2G_SPE=G0-V2G-SPE
PROFILE_G0-V2G_NS=G0-V2G-NS
PROFILE_RAT-V2G_SPE=RAT-V2G-SPE
PROFILE_RAT-V2G_NS=RAT-V2G-NS
PROFILE_RD0047-V2G_SPE=RD0047-V2G-SPE
PROFILE_RD0047-V2G_NS=RD0047-V2G-NS
PROFILE_SECC-AC-1_SPE=SECC-AC-1-SPE
PROFILE_SECC-AC-1_NS=SECC-AC-1-NS

# 非规范命名示例：OCPP-FW-CCU 不带 -SPE/-NS 后缀，且两侧共用同一把密钥
# （服务端不解析命名语义，这里显式映射即可）
PROFILE_OCPP-FW-CCU_SPE=OCPP-FW-CCU
PROFILE_OCPP-FW-CCU_NS=OCPP-FW-CCU
